name: Fetch full-resolution photos
on:
  push:
    paths: ['.github/workflows/fetch-hires-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _hires _tmp
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          base="https://sites.google.com/view/woodpeckerchalet"
          for p in home lodging amenities amenities/private-chef-and-catering amenities/spa-and-wellness virginia-is-for-lvers; do
            curl -sSL -A "$UA" "$base/$p" -o "_tmp/$(echo $p | tr / _).html"
          done
          cat _tmp/*.html | sed 's/\\u003d/=/g; s/&amp;/\&/g' \
            | grep -oE 'https://(sites\.google\.com/sitesv-images-rt|lh[0-9]\.googleusercontent\.com/sitesv)/[A-Za-z0-9_=./-]+' \
            | sed -E 's/=w[0-9]+(-h[0-9]+)?.*$//; s/=s[0-9]+.*$//' | awk '!seen[$0]++' > _tmp/urls.txt
          echo "found $(wc -l < _tmp/urls.txt)"
          n=0
          while read -r u; do
            n=$((n+1)); curl -sSL -A "$UA" "$u=w3200" -o "_hires/$(printf %03d $n).jpg" || echo "fail $n"
          done < _tmp/urls.txt
          ls _hires | wc -l
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add _hires && git commit -m "Fetch full-resolution photos (3)" && git push
